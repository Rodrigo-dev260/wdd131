<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Week 04 Table</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        .cor {
            background-color: rgb(117, 116, 116);
            color: white;
        }

        .cor > .borda {
            background-color: black;
        }

        h1 {
            background-color: black;
            width: 500px;
            padding: 30px 0;
            color: white;
            font-size: 1.5rem;
            text-align: center;
            margin-bottom: 0;
        }

        table {
            width: 500px;
            height: 200px;
            border-collapse: collapse;
        }

        td, th{
            text-align: center;
            border: 1px solid black;
            padding: 10px;
        }

        tbody > tr:nth-child(even) {
            background-color: lightgrey;
        }
    </style>
</head>
<body>
    <h1>ACME Wildwest Services</h1>
    <table>
        <thead>
            <tr class="cor">
                <th class="borda"></th>
                <th>Basic</th>
                <th>Premium</th>
                <th>Deluxe</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th><strong>Feature 1</strong></th>
                <td>✔️</td>
                <td>✔️</td>
                <td>✔️</td>
            </tr>
            <tr>
                <th><strong>Feature 2</strong></th>
                <td>❌</td>
                <td>✔️</td>
                <td>✔️</td>
            </tr>
            <tr>
                <th><strong>Feature 3</strong></th>
                <td>❌</td>
                <td>❌</td>
                <td>✔️</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
